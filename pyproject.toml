[project]
name = "doctor-who-ratings"
version = "0.1.0"
description = "Data pipeline and reference rankings for the Rating the Regenerations demo."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mark Bugden" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
